<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | ProUchet</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --panel-soft: #eef6ff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #0f172a;
            --text-soft: #475569;
            --line: #e2e8f0;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body { min-height: 100vh; }
        .admin-shell { display: none; max-width: 1400px; margin: 0 auto; padding: 24px; }
        .auth-gate { max-width: 420px; margin: 12vh auto; padding: 24px; background: white; border: 1px solid var(--line); border-radius: 16px; }
        .auth-gate h1 { margin-top: 0; font-size: 1.4rem; }
        .auth-gate form { display: grid; gap: 12px; }
        .auth-gate input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; }
        .auth-message { min-height: 1.4em; color: var(--danger); }
        .application-status { border: 1px solid var(--line); border-radius: 8px; padding: 7px; background: white; }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px 22px;
            box-shadow: 0 10px 25px rgba(15,23,42,0.04);
        }
        .topbar h1 {
            margin: 0;
            font-size: clamp(1.4rem, 2vw, 2rem);
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge, .soft-btn, .danger-btn, .primary-btn {
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .badge {
            background: var(--panel-soft);
            color: var(--primary-dark);
        }
        .soft-btn { background: #eff6ff; color: var(--primary-dark); }
        .primary-btn { background: var(--primary); color: white; }
        .danger-btn { background: #fee2e2; color: var(--danger); }
        .layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
        .sidebar {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .sidebar h3 {
            margin: 0 0 16px;
            font-size: 1rem;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-soft);
            background: #f8fafc;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 14px;
            transition: 0.2s ease;
        }
        .sidebar a.active, .sidebar a:hover {
            background: #eff6ff;
            color: var(--primary-dark);
            border-color: #dbeafe;
        }
        .sidebar a i { width: 18px; text-align: center; }
        .content-card .icon-box { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 10px; border-radius: 10px; background: var(--panel-soft); color: var(--primary); }
        .content-card .icon-box i { font-size: 1.1rem; }

        .content { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }
        .stat-card {
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid var(--line);
            padding: 14px 16px;
        }
        .stat-card .label {
            color: var(--text-soft);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .stat-card .value {
            margin-top: 6px;
            font-size: 1.6rem;
            font-weight: 800;
        }

        .panel-box {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .panel-head h2 {
            margin: 0;
            font-size: 1.25rem;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar input, .toolbar select {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
            background: white;
            color: var(--text);
        }
        .toolbar input { min-width: 220px; }

        .section-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .section-box {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            background: #fbfdff;
        }
        .section-box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }
        .section-box-header h3 {
            margin: 0;
            font-size: 1.05rem;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .content-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            position: relative;
            min-height: 150px;
        }
        .content-card h4 {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }
        .content-card p {
            margin: 0;
            color: var(--text-soft);
            line-height: 1.6;
        }
        .content-card .meta {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--text-soft);
            font-size: 0.8rem;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .mini-btn {
            border: 1px solid var(--line);
            background: white;
            color: var(--text-soft);
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .mini-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
        .mini-btn.danger { background: #ffefef; color: var(--danger); border-color: #fecaca; }
        .mini-btn.warning { background: #fff7ed; color: var(--warning); border-color: #fed7aa; }
        .add-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            background: white;
            color: var(--primary-dark);
            font-size: 2.5rem;
            font-weight: 700;
            cursor: pointer;
        }

        .table-wrap { min-width: 0; overflow-x: auto; }
        .applications-table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
            margin-top: 8px;
        }
        .applications-table th, .applications-table td {
            border-bottom: 1px solid var(--line);
            text-align: left;
            padding: 14px 10px;
            vertical-align: top;
        }
        .applications-table th {
            color: var(--text-soft);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .application-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .status.new { background: #dcfce7; color: #166534; }
        .status.review { background: #fef3c7; color: #92400e; }
        .status.done { background: #dbeafe; color: #1d4ed8; }

        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: sticky; top: 8px; z-index: 5; min-width: 0; padding: 8px; }
            .sidebar h3 { display: none; }
            .sidebar nav { width: 100%; min-width: 0; flex-direction: row; gap: 4px; overflow-x: auto; }
            .sidebar a { flex: 0 0 auto; padding: 10px 12px; }
            .stats-grid { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
            .toolbar { width: 100%; }
        }
        @media (max-width: 560px) {
            .admin-shell { padding: 12px; }
            .topbar { align-items: flex-start; padding: 14px; }
            .topbar-actions { justify-content: flex-end; }
            .topbar-actions button { padding: 9px 10px; }
            .stats-grid { grid-template-columns: 1fr; }
        }

        :root {
            --bg: #f1f5f7;
            --panel-soft: #e5f4f2;
            --primary: #087e78;
            --primary-dark: #08645f;
            --text: #172a32;
            --text-soft: #64747b;
            --line: #dce5e7;
            --success: #16805d;
            --warning: #b76b12;
            --danger: #c34444;
        }
        html, body { font-family: 'Manrope', 'Segoe UI', sans-serif; }
        body { background: var(--bg); }
        .admin-shell { max-width: 1500px; padding: 28px clamp(14px, 3vw, 36px); }
        .topbar {
            position: relative;
            overflow: hidden;
            color: #f5fbfa;
            background: #172a32;
            border: 0;
            border-radius: 10px;
            padding: 22px 26px;
            box-shadow: 0 12px 30px rgba(23, 42, 50, 0.12);
        }
        .topbar h1 { position: relative; z-index: 1; font-size: 1.45rem; letter-spacing: 0; }
        .topbar h1::before {
            display: block;
            margin-bottom: 5px;
            color: #87c8bd;
            content: 'УПРАВЛЕНИЕ САЙТОМ';
            font-size: 0.67rem;
            font-weight: 800;
            letter-spacing: 0.12em;
        }
        .topbar-actions { position: relative; z-index: 1; }
        .badge, .soft-btn, .danger-btn, .primary-btn {
            border-radius: 7px;
            padding: 10px 13px;
            font: inherit;
            font-size: 0.83rem;
            transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        }
        button { font-family: inherit; }
        button:hover { transform: translateY(-1px); }
        .soft-btn { background: #263b43; color: #f5fbfa; border: 1px solid #40545a; }
        .soft-btn:hover { background: #334a51; }
        .danger-btn { background: #fbe8e5; color: #9f3938; }
        .primary-btn { background: var(--primary); }
        .layout { grid-template-columns: 205px minmax(0, 1fr); gap: 20px; margin-top: 20px; }
        .sidebar { border-radius: 10px; padding: 14px; box-shadow: 0 5px 20px rgba(23, 42, 50, 0.035); }
        .sidebar h3 { padding: 6px 9px 4px; color: #839197; font-size: 0.67rem; letter-spacing: 0.13em; }
        .sidebar nav { gap: 4px; }
        .sidebar a { border-radius: 7px; padding: 11px 10px; font-size: 0.86rem; }
        .sidebar a i { color: #829399; }
        .sidebar a.active, .sidebar a:hover { background: #e5f4f2; color: var(--primary-dark); border-color: transparent; }
        .sidebar a.active i, .sidebar a:hover i { color: var(--primary); }
        .content { gap: 18px; }
        .stats-grid { gap: 14px; }
        .stat-card { position: relative; overflow: hidden; border-radius: 9px; padding: 18px 20px; box-shadow: 0 5px 20px rgba(23, 42, 50, 0.035); }
        .stat-card::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--primary); content: ''; }
        .stat-card:nth-child(2)::before { background: #d39037; }
        .stat-card:nth-child(3)::before { background: #4187a2; }
        .stat-card .label { color: #78888e; font-size: 0.7rem; letter-spacing: 0.1em; }
        .stat-card .value { font-size: 1.8rem; }
        .panel-box { border-radius: 9px; padding: 22px; box-shadow: 0 5px 20px rgba(23, 42, 50, 0.035); }
        .panel-head { margin-bottom: 18px; }
        .panel-head h2 { font-size: 1.15rem; letter-spacing: 0; }
        .toolbar input, .toolbar select, .auth-gate input { border-radius: 7px; border-color: #d6e0e2; font: inherit; }
        .toolbar input:focus, .toolbar select:focus, .auth-gate input:focus { outline: 3px solid #c8e8e3; border-color: var(--primary); }
        .section-stack { gap: 16px; }
        .section-box { border-radius: 8px; padding: 17px; background: #f8faf9; }
        .section-box-header { margin-bottom: 15px; }
        .section-box-header h3 { font-size: 0.98rem; }
        .cards-grid { gap: 10px; }
        .content-card { border-radius: 7px; padding: 15px; min-height: 0; box-shadow: 0 2px 8px rgba(23, 42, 50, 0.025); }
        .content-card h4 { font-size: 0.98rem; }
        .content-card p { font-size: 0.88rem; }
        .content-card .icon-box { border-radius: 7px; background: #e5f4f2; color: var(--primary); }
        .mini-btn { border-radius: 6px; font: inherit; font-size: 0.77rem; padding: 7px 9px; }
        .mini-btn.primary { background: var(--primary); border-color: var(--primary); }
        .mini-btn.danger { background: #fcebea; color: #a53d3c; border-color: #f2d0cd; }
        .mini-btn.warning { background: #fbf1e2; color: #99601f; border-color: #ecd7b7; }
        .add-card { min-height: 150px; border-radius: 7px; border-color: #bfd3d2; background: #f8fcfb; color: var(--primary); }
        .applications-table th { color: #74848a; }
        .applications-table td { font-size: 0.88rem; }
        .application-status { font: inherit; font-size: 0.82rem; }
        .application-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 12px; color: #64747b; font-size: 0.82rem; }
        .application-shortcuts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .application-shortcuts .mini-btn { background: #fff; }
        .application-shortcuts .mini-btn.active { border-color: #91c9c1; background: #e5f4f2; color: #08645f; }
        .application-count { display: inline-flex; min-width: 28px; height: 26px; align-items: center; justify-content: center; padding: 0 8px; border-radius: 99px; background: #edf2f3; color: #34484f; font-weight: 800; }
        .application-contact { display: inline-flex; align-items: center; gap: 7px; border-color: #cbe4d8; background: #eff8f2; color: #176344; white-space: nowrap; text-decoration: none; }
        .application-bulk { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; padding: 11px 12px; border: 1px solid #c8e3df; border-radius: 7px; background: #eff8f6; color: #24564e; font-size: 0.84rem; }
        .application-bulk[hidden] { display: none; }
        .application-bulk-actions { display: flex; gap: 7px; flex-wrap: wrap; }
        .application-pagination { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; color: #64747b; font-size: 0.82rem; }
        .application-pagination-controls { display: flex; gap: 6px; }
        .application-pagination select { margin-left: 5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); font: inherit; }
        .application-pagination button:disabled { opacity: 0.45; cursor: default; transform: none; }
        .application-select { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
        .application-select-cell { width: 38px; }
        .application-actions { min-width: 220px; }
        .applications-table tr[data-status="unread"] td:first-child { border-left: 3px solid #087e78; }
        .applications-table td:first-child { padding-left: 12px; }
        .auth-gate { border-radius: 10px; box-shadow: 0 14px 40px rgba(23, 42, 50, 0.08); }
        .auth-gate .primary-btn { font: inherit; }
        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { border-radius: 8px; }
            .sidebar nav { gap: 5px; }
            .sidebar a { padding: 9px 10px; }
        }
        @media (max-width: 560px) {
            .admin-shell { padding: 10px; }
            .topbar { flex-direction: column; gap: 14px; padding: 17px; }
            .topbar h1 { font-size: 1.18rem; }
            .topbar-actions { width: 100%; justify-content: flex-start; }
            .topbar-actions button { padding: 8px 9px; font-size: 0.75rem; }
            .panel-box { padding: 14px; }
            .panel-head h2 { font-size: 1.05rem; }
            .section-box { padding: 12px; }
            .section-box-header { align-items: flex-start; }
            .application-summary { align-items: flex-start; flex-direction: column; }
            .application-shortcuts { width: 100%; }
            .application-bulk, .application-pagination { align-items: flex-start; flex-direction: column; }
            .application-bulk-actions { width: 100%; }
        }
    </style>
</head>
<body>
    <section class="auth-gate" id="authGate">
        <h1>Вход администратора</h1>
        <form id="adminAuthForm">
            <input type="email" name="email" placeholder="Email администратора" autocomplete="username" required>
            <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
            <button class="primary-btn" type="submit">Войти</button>
            <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        </form>
    </section>
    <div class="admin-shell">
        <header class="topbar">
            <h1>Админ-панель ProUchet</h1>
            <div class="topbar-actions">
                <button class="soft-btn" type="button" id="syncBtn"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Обновить данные</button>
                <button class="soft-btn" type="button" id="siteBtn"><i class="fa-solid fa-house" aria-hidden="true"></i> На сайт</button>
                <button class="danger-btn" type="button" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i> Выйти из аккаунта</button>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar" aria-label="Навигация по админ-панели">
                <h3>Разделы</h3>
                <nav>
                    <a href="#overview"><i class="fa-solid fa-gauge" aria-hidden="true"></i> Обзор</a>
                    <a href="#section-benefits"><i class="fa-solid fa-star" aria-hidden="true"></i> Преимущества</a>
                    <a href="#section-faq"><i class="fa-solid fa-circle-question" aria-hidden="true"></i> FAQ</a>
                    <a href="#section-courses"><i class="fa-solid fa-book-open" aria-hidden="true"></i> Курсы</a>
                    <a href="#section-footer"><i class="fa-solid fa-window-maximize" aria-hidden="true"></i> Футер</a>
                    <a href="#applications"><i class="fa-solid fa-inbox" aria-hidden="true"></i> Заявки</a>
                </nav>
            </aside>
            <main class="content">
                <div class="stats-grid" id="overview">
                    <div class="stat-card">
                        <div class="label">Всего секций</div>
                        <div class="value" id="totalSections">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Карточек</div>
                        <div class="value" id="totalCards">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Новых заявок</div>
                        <div class="value" id="newRequests">0</div>
                    </div>
                </div>

                <section class="panel-box" id="content">
                    <div class="panel-head">
                        <h2>Редактор контента</h2>
                        <div class="toolbar">
                            <input id="searchInput" type="search" placeholder="Поиск по контенту и курсам">
                            <select id="sortSelect">
                                <option value="order">По порядку</option>
                                <option value="date-asc">По дате ↑</option>
                                <option value="alpha">По алфавиту</option>
                            </select>
                        </div>
                    </div>

                    <div class="section-stack" id="contentSections"></div>
                </section>

                <section class="panel-box" id="applications">
                    <div class="panel-head">
                        <h2>Заявки</h2>
                        <div class="toolbar">
                            <select id="applicationFilter">
                                <option value="all">Все статусы</option>
                                <option value="unread" selected>Не прочитано</option>
                                <option value="viewed">Просмотрено</option>
                                <option value="archived">Архив</option>
                            </select>
                            <select id="paymentFilter">
                                <option value="all">Любая оплата</option>
                                <option value="pending">Ожидает оплаты</option>
                                <option value="paid">Оплачено</option>
                                <option value="rejected">Оплата отклонена</option>
                            </select>
                            <select id="applicationSort">
                                <option value="date-desc">Сначала новые</option>
                                <option value="date-asc">Сначала старые</option>
                                <option value="alpha">По алфавиту</option>
                            </select>
                            <input id="applicationSearch" type="search" placeholder="Поиск: ФИО или телефон">
                        </div>
                    </div>
                    <div class="application-summary">
                        <div class="application-shortcuts" id="applicationShortcuts" aria-label="Быстрые фильтры заявок">
                            <button class="mini-btn active" type="button" data-application-filter-button="unread">Новые</button>
                            <button class="mini-btn" type="button" data-application-filter-button="all">Все</button>
                            <button class="mini-btn" type="button" data-application-filter-button="archived">Архив</button>
                            <button class="mini-btn" type="button" id="resetApplications" title="Сбросить фильтры и поиск"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Сбросить</button>
                        </div>
                        <div>Найдено: <span class="application-count" id="applicationCount">0</span></div>
                    </div>
                    <div class="application-bulk" id="applicationBulkActions" hidden>
                        <span>Выбрано: <strong id="selectedApplicationCount">0</strong></span>
                        <div class="application-bulk-actions">
                            <button class="mini-btn primary" type="button" data-bulk-application-action="viewed"><i class="fa-solid fa-check" aria-hidden="true"></i> Просмотрено</button>
                            <button class="mini-btn" type="button" data-bulk-application-action="archived"><i class="fa-solid fa-box-archive" aria-hidden="true"></i> В архив</button>
                            <button class="mini-btn" type="button" id="clearApplicationSelection">Снять выбор</button>
                        </div>
                    </div>
                    <div class="table-wrap"><table class="applications-table">
                        <thead>
                            <tr>
                                <th class="application-select-cell"><input class="application-select" id="selectAllApplications" type="checkbox" aria-label="Выбрать заявки на странице"></th>
                                <th>ФИО</th>
                                <th>Телефон</th>
                                <th>Курс</th>
                                <th>Дата</th>
                                <th>Просмотр</th>
                                <th>Оплата</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsBody"></tbody>
                    </table></div>
                    <div class="application-pagination">
                        <label>На странице
                            <select id="applicationPageSize" aria-label="Количество заявок на странице">
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </label>
                        <span id="applicationPageInfo">0 заявок</span>
                        <div class="application-pagination-controls">
                            <button class="mini-btn" type="button" id="previousApplicationPage" aria-label="Предыдущая страница"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
                            <button class="mini-btn" type="button" id="nextApplicationPage" aria-label="Следующая страница"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script type="application/json" id="legacyAdminMock">
        const contentState = {
            benefits: [
                { id: 1, title: 'Облачная 1С', text: 'Практика в самой свежей версии 8.3 без установки программ на компьютер.', updated: '2026-10-12' },
                { id: 2, title: 'Быстрый старт', text: 'Выходим на первый доход в профессии уже через 2 месяца обучения.', updated: '2026-10-11' },
                { id: 3, title: 'Поддержка', text: 'Личный куратор-эксперт отвечает на вопросы в течение 15 минут.', updated: '2026-10-10' }
            ],
            faq: [
                { id: 1, title: 'Какие курсы вы предлагаете?', text: 'Мы предлагаем базовый, стандартный и PRO-level курсы по бухгалтерии и налогам.', updated: '2026-10-08' },
                { id: 2, title: 'Нужен ли опыт?', text: 'Нет, курсы рассчитаны на начинающих и тех, кто хочет обновить знания.', updated: '2026-10-07' },
                { id: 3, title: 'Можно ли учиться онлайн?', text: 'Да, мы предлагаем гибкий формат обучения с поддержкой преподавателя.', updated: '2026-10-06' }
            ],
            courses: [
                { id: 1, title: 'Basic', text: 'Основы бухгалтерии и налогов ИП.', price: '99.000 тг', updated: '2026-10-12' },
                { id: 2, title: 'Standart', text: 'Бухгалтер ИП и ТОО.', price: '199.000 тг', updated: '2026-10-11' },
                { id: 3, title: 'PRO', text: 'Профессиональный бухгалтер + налоговые проверки.', price: '269.000 тг', updated: '2026-10-10' }
            ]
        };

        const applications = [
            { id: 1, name: 'Иван Петров', phone: '+7 777 111 22 33', date: '2026-10-14', status: 'new' },
            { id: 2, name: 'Алия Нурланова', phone: '+7 707 555 77 88', date: '2026-10-13', status: 'review' },
            { id: 3, name: 'Максим Сидоров', phone: '+7 705 444 66 55', date: '2026-10-10', status: 'done' },
            { id: 4, name: 'Динара Тулеуова', phone: '+7 701 222 99 88', date: '2026-10-09', status: 'new' }
        ];

        const sectionLabels = {
            benefits: 'Плюсы',
            faq: 'FAQ',
            courses: 'Курсы'
        };

        function renderContentSections() {
            const container = document.getElementById('contentSections');
            const search = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
            const sortMode = document.getElementById('sortSelect')?.value || 'date-desc';

            const renderList = (key) => {
                let items = [...contentState[key]];

                if (search) {
                    items = items.filter(item => {
                        const haystack = `${item.title} ${item.text} ${item.price || ''}`.toLowerCase();
                        return haystack.includes(search);
                    });
                }

                if (sortMode === 'alpha') {
                    items.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
                } else if (sortMode === 'date-asc') {
                    items.sort((a, b) => new Date(a.updated) - new Date(b.updated));
                } else {
                    items.sort((a, b) => new Date(b.updated) - new Date(a.updated));
                }

                return items.map(item => `
                    <div class="content-card">
                        <h4>${item.title}</h4>
                        <p>${item.text}</p>
                        ${item.price ? `<div class="meta"><span>Цена</span><strong>${item.price}</strong></div>` : `<div class="meta"><span>Обновлено</span><strong>${item.updated}</strong></div>`}
                        <div class="card-actions">
                            <button class="mini-btn primary" data-action="edit" data-section="${key}" data-id="${item.id}">Редактировать</button>
                            <button class="mini-btn warning" data-action="move" data-section="${key}" data-id="${item.id}">Переместить</button>
                            <button class="mini-btn danger" data-action="delete" data-section="${key}" data-id="${item.id}">Удалить</button>
                        </div>
                    </div>
                `).join('');
            };

            const html = Object.entries(sectionLabels).map(([key, label]) => `
                <div class="section-box">
                    <div class="section-box-header">
                        <h3>${label}</h3>
                        <button class="primary-btn" type="button" data-action="add" data-section="${key}">+ Добавить</button>
                    </div>
                    <div class="cards-grid">
                        ${renderList(key)}
                        <button class="add-card" type="button" data-action="add" data-section="${key}" aria-label="Добавить карточку">+</button>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
            updateStats();
        }

        function renderApplications() {
            const filterValue = document.getElementById('applicationFilter')?.value || 'all';
            const filtered = applications.filter(item => filterValue === 'all' || item.status === filterValue);

            document.getElementById('applicationsBody').innerHTML = filtered.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.phone}</td>
                    <td>${item.date}</td>
                    <td><span class="status ${item.status}">${statusLabel(item.status)}</span></td>
                    <td>
                        <button class="mini-btn" type="button" data-application-id="${item.id}">Открыть</button>
                    </td>
                </tr>
            `).join('');
        }

        function statusLabel(status) {
            if (status === 'new') return 'Новая';
            if (status === 'review') return 'Проверяется';
            return 'Обработана';
        }

        function updateStats() {
            const totalCards = Object.values(contentState).reduce((sum, items) => sum + items.length, 0);
            const totalSections = Object.keys(contentState).length;
            const newRequests = applications.filter(item => item.status === 'new').length;

            document.getElementById('totalSections').textContent = String(totalSections);
            document.getElementById('totalCards').textContent = String(totalCards);
            document.getElementById('newRequests').textContent = String(newRequests);
        }

        document.body.addEventListener('click', (event) => {
            const actionTarget = event.target.closest('[data-action]');
            if (!actionTarget) return;

            const { action, section, id } = actionTarget.dataset;

            if (action === 'add') {
                const list = contentState[section];
                list.push({
                    id: Date.now(),
                    title: `${sectionLabels[section]} #${list.length + 1}`,
                    text: 'Новый блок. Замените текст после подключения Supabase.',
                    updated: new Date().toISOString().slice(0, 10)
                });
                renderContentSections();
                return;
            }

            if (action === 'delete') {
                const list = contentState[section];
                contentState[section] = list.filter(item => String(item.id) !== String(id));
                renderContentSections();
            }

            if (action === 'edit') {
                alert('Подключите редактор через Supabase и сформируйте modal для редактирования блока.');
            }

            if (action === 'move') {
                alert('Перемещение карточки будет добавлено после привязки к Supabase / drag-and-drop логике.');
            }
        });

        document.getElementById('searchInput').addEventListener('input', renderContentSections);
        document.getElementById('sortSelect').addEventListener('change', renderContentSections);
        document.getElementById('applicationFilter').addEventListener('change', renderApplications);

        document.getElementById('syncBtn').addEventListener('click', () => {
            alert('Синхронизация с Supabase будет активна после установки ключей и таблиц в проекте.');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        renderContentSections();
        renderApplications();
    </script>
    <script src="scripts/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="scripts/supabase-client.js"></script>
    <script src="scripts/admin.js"></script>
</body>
</html>
